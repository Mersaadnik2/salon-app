name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "زیبانو" "com.zibano.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate app icon & splash
        run: |
          if [ -f assets/logo.png ]; then
            npm install -D @capacitor/assets
            npx @capacitor/assets generate --android --iconBackgroundColor '#FAF7F5' --splashBackgroundColor '#FAF7F5'
          else
            echo "لوگو پیدا نشد — با آیکون پیش‌فرض ادامه می‌دهیم"
          fi

      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zibano-debug-keystore-v1

      - name: Create debug keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-Zibano-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
